<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Responsible AI Assessment Workbench</title>

  <style>
    /* =====================================================
       PART 1 — DESIGN SYSTEM
    ===================================================== */

    :root {
      --navy-950: #061326;
      --navy-900: #0b1f3b;
      --navy-800: #12325b;
      --navy-700: #1c4a7a;

      --coral-600: #ff4d57;
      --coral-500: #ff6b5f;
      --coral-100: #ffe7e4;

      --bg-main: #f6f4f2;
      --bg-card: #ffffff;
      --bg-soft: #f1f5f9;

      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-300: #cbd5e1;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;

      --green-600: #15803d;
      --green-100: #dcfce7;
      --amber-600: #b45309;
      --amber-100: #fef3c7;
      --red-600: #b91c1c;
      --red-100: #fee2e2;

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;

      --shadow-soft: 0 16px 40px rgba(15, 23, 42, 0.08);
      --shadow-card: 0 10px 30px rgba(15, 23, 42, 0.07);

      --sidebar-width: 290px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 107, 95, 0.16), transparent 32rem),
        linear-gradient(135deg, #f8fafc, var(--bg-main));
      color: var(--slate-900);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(18px);
      border-right: 1px solid var(--slate-200);
      overflow-y: auto;
      z-index: 10;
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--navy-900), var(--coral-500));
      color: white;
      font-weight: 900;
      letter-spacing: -0.04em;
      box-shadow: var(--shadow-card);
    }

    .brand-title {
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .brand-subtitle {
      margin-top: 4px;
      color: var(--slate-500);
      font-size: 0.82rem;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--slate-600);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      transition: 0.18s ease;
    }

    .nav-button:hover {
      background: var(--slate-100);
      color: var(--navy-900);
    }

    .nav-button.active {
      background: var(--navy-900);
      color: white;
      font-weight: 800;
    }

    .sidebar-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--slate-200);
    }

    .sidebar-label {
      margin-bottom: 10px;
      color: var(--slate-500);
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .main {
      min-width: 0;
      padding: 28px;
    }

    .topbar {
      margin-bottom: 24px;
      padding: 22px;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow-soft);
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
    }

    .mobile-menu {
      display: none;
      margin-bottom: 12px;
    }

    .eyebrow {
      color: var(--coral-600);
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(1.75rem, 3vw, 2.65rem);
      letter-spacing: -0.06em;
      line-height: 1;
    }

    h2 {
      font-size: 1.22rem;
      letter-spacing: -0.03em;
    }

    h3 {
      font-size: 1rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      max-width: 780px;
      color: var(--slate-600);
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .button {
      border: 1px solid var(--slate-200);
      background: white;
      color: var(--slate-900);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.05);
      transition: 0.18s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1);
    }

    .button.primary {
      background: var(--navy-900);
      color: white;
      border-color: var(--navy-900);
    }

    .button.coral {
      background: var(--coral-500);
      color: white;
      border-color: var(--coral-500);
    }

    .button.ghost {
      background: transparent;
      box-shadow: none;
    }

    .button.danger {
      color: var(--red-600);
    }

    .button.small {
      padding: 7px 11px;
      font-size: 0.86rem;
    }

    .view {
      display: grid;
      gap: 20px;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-card);
    }

    .card.soft {
      background: rgba(248, 250, 252, 0.82);
    }

    .metric-card {
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-label {
      color: var(--slate-500);
      font-weight: 800;
      font-size: 0.9rem;
    }

    .metric-value {
      margin-top: 10px;
      font-size: 2.3rem;
      font-weight: 950;
      letter-spacing: -0.07em;
    }

    .metric-helper {
      margin-top: 12px;
      color: var(--slate-500);
      font-size: 0.9rem;
    }

    .pill {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--slate-100);
      color: var(--slate-600);
      font-size: 0.78rem;
      font-weight: 900;
    }

    .pill.green {
      background: var(--green-100);
      color: var(--green-600);
    }

    .pill.amber {
      background: var(--amber-100);
      color: var(--amber-600);
    }

    .pill.red {
      background: var(--red-100);
      color: var(--red-600);
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .list-item {
      border: 1px solid var(--slate-200);
      background: white;
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .item-title {
      font-weight: 900;
      margin-bottom: 4px;
    }

    .item-meta {
      color: var(--slate-500);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .empty {
      padding: 38px 24px;
      border: 1px dashed var(--slate-300);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.6);
      text-align: center;
      color: var(--slate-500);
    }

    .empty strong {
      display: block;
      color: var(--slate-900);
      margin-bottom: 8px;
      font-size: 1.05rem;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      font-weight: 900;
      font-size: 0.9rem;
    }

    .field small {
      color: var(--slate-500);
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid var(--slate-200);
      border-radius: 14px;
      background: white;
      padding: 11px 13px;
      color: var(--slate-900);
      outline: none;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--navy-700);
      box-shadow: 0 0 0 4px rgba(28, 74, 122, 0.12);
    }

    .divider {
      height: 1px;
      background: var(--slate-200);
      margin: 18px 0;
    }

    .notice {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--coral-100);
      color: var(--slate-900);
      border: 1px solid rgba(255, 107, 95, 0.22);
      line-height: 1.5;
    }

    .code-anchor {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.82rem;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--slate-100);
      color: var(--slate-700);
    }

    @media (max-width: 940px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
        position: fixed;
        inset: 0 auto 0 0;
        width: min(86vw, 330px);
      }

      .sidebar.open {
        display: block;
      }

      .main {
        padding: 16px;
      }

      .topbar {
        flex-direction: column;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .mobile-menu {
        display: inline-flex;
      }

      .grid.two,
      .grid.three {
        grid-template-columns: 1fr;
      }
    }

    /* =====================================================
       PASTE PART 7 CSS POLISH HERE
    ===================================================== */
.workspace-header {
  display: grid;
  gap: 14px;
}

.workspace-title-row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
  flex-wrap: wrap;
}

.workspace-title {
  margin: 0;
  font-size: 1.45rem;
  letter-spacing: -0.04em;
}

.workspace-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 6px;
  border: 1px solid var(--slate-200);
  background: var(--slate-100);
  border-radius: 999px;
  width: fit-content;
}

.workspace-tab {
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--slate-600);
  padding: 9px 13px;
  font-weight: 900;
}

.workspace-tab.active {
  background: white;
  color: var(--navy-900);
  box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
}

.assessment-rail {
  position: sticky;
  top: 24px;
}

.save-status {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  color: var(--green-600);
  font-size: 0.86rem;
  font-weight: 900;
}

.hero-card {
  background:
    radial-gradient(circle at top right, rgba(255, 107, 95, 0.18), transparent 20rem),
    linear-gradient(135deg, white, #f8fafc);
}

.workflow-steps {
  display: grid;
  gap: 12px;
}

.workflow-step {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 12px;
  align-items: start;
}

.step-number {
  width: 34px;
  height: 34px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  background: var(--navy-900);
  color: white;
  font-weight: 900;
}

.hero-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.assessment-card {
  transition: 0.18s ease;
}

.assessment-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-soft);
}

.empty-action {
  margin-top: 16px;
}

.wizard-stepper {
  display: grid;
  gap: 10px;
}

.wizard-step {
  border: 1px solid var(--slate-200);
  background: white;
  border-radius: var(--radius-md);
  padding: 14px;
  text-align: left;
  display: grid;
  gap: 6px;
  transition: 0.18s ease;
}

.wizard-step:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-card);
}

.wizard-step.active {
  border-color: var(--navy-900);
  background: var(--navy-900);
  color: white;
}

.wizard-step.active .item-meta {
  color: rgba(255, 255, 255, 0.78);
}

.wizard-question {
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  padding: 18px;
  background: white;
}

.wizard-question.answered {
  border-color: rgba(21, 128, 61, 0.35);
  background: linear-gradient(135deg, white, #f8fff9);
}

.wizard-footer {
  position: sticky;
  bottom: 16px;
  z-index: 5;
  border: 1px solid var(--slate-200);
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(16px);
  border-radius: var(--radius-lg);
  padding: 14px;
  box-shadow: var(--shadow-soft);
}

.question-status {
  font-size: 0.8rem;
  font-weight: 900;
  color: var(--green-600);
}

.risk-hero {
  display: grid;
  gap: 16px;
  border-radius: var(--radius-lg);
  padding: 24px;
  background: linear-gradient(135deg, white, #f8fafc);
  border: 1px solid var(--slate-200);
}

.risk-score-large {
  font-size: clamp(3rem, 8vw, 5rem);
  font-weight: 950;
  letter-spacing: -0.08em;
  line-height: 0.9;
}

.priority-card {
  border-left: 6px solid var(--navy-900);
}

.priority-card.high {
  border-left-color: var(--red-600);
}

.priority-card.medium {
  border-left-color: var(--amber-600);
}

.priority-card.low {
  border-left-color: var(--green-600);
}

.executive-summary {
  white-space: pre-wrap;
  line-height: 1.65;
}

.prototype-banner {
  border: 1px solid rgba(255, 107, 95, 0.35);
  background: linear-gradient(135deg, #fff7f5, white);
  border-radius: var(--radius-lg);
  padding: 16px;
  display: grid;
  gap: 6px;
}

.trust-strip {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.trust-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  background: white;
  border: 1px solid var(--slate-200);
  padding: 7px 11px;
  font-size: 0.82rem;
  font-weight: 900;
  color: var(--slate-600);
}

.demo-note {
  font-size: 0.9rem;
  color: var(--slate-600);
  line-height: 1.55;
}

.progress-bar {
  width: 100%;
  height: 10px;
  border-radius: 999px;
  background: var(--slate-100);
  overflow: hidden;
  border: 1px solid var(--slate-200);
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--navy-900), var(--coral-500));
  border-radius: inherit;
}

.print-only {
  display: none;
}

@media print {
  body {
    background: white;
  }

  .sidebar,
  .topbar,
  .toolbar,
  .button {
    display: none !important;
  }

  .app-shell {
    display: block;
  }

  .main {
    padding: 0;
  }

  .card {
    box-shadow: none;
    break-inside: avoid;
  }

  .print-only {
    display: block;
  }
}

  </style>
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div>
          <div class="brand-title">Responsible AI<br />Workbench</div>
          <div class="brand-subtitle">AI triage, risk & controls</div>
        </div>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="sidebar-section">
        <div class="sidebar-label">Local file build</div>
        <button class="button small" data-action="seed-demo">Seed demo</button>
        <button class="button small danger" data-action="reset-data">Reset</button>
      </div>
    </aside>

    <main class="main">
      <section class="topbar">
        <div>
          <button class="button mobile-menu" data-action="toggle-menu">Menu</button>
          <div class="eyebrow" id="page-eyebrow">Responsible AI</div>
          <h1 id="page-title">Dashboard</h1>
          <p class="subtitle" id="page-subtitle"></p>
        </div>

        <div class="toolbar" id="toolbar"></div>
      </section>

      <section class="view" id="view"></section>
    </main>
  </div>

  <script>
    /* =====================================================
       PART 1 — APP FOUNDATION
    ===================================================== */

    const APP_KEY = "responsible_ai_workbench_clean_v1";

    const routes = [
  {
    id: "dashboard",
    label: "Dashboard",
    icon: "◇",
    title: "Dashboard",
    subtitle: "Start, continue, and review responsible AI assessments from one place."
  },
  {
    id: "assessments",
    label: "Assessments",
    icon: "▣",
    title: "Assessment Workspace",
    subtitle: "Create, edit, complete, score, and export a selected AI use case assessment."
  },
  {
    id: "tools",
    label: "Tools",
    icon: "✦",
    title: "Tools",
    subtitle: "Prompt helper, governance checklist, export tools, and reusable artefacts."
  },
  {
    id: "settings",
    label: "Settings",
    icon: "⚙",
    title: "Settings",
    subtitle: "Manage local data, demo content, QA checks, and deployment settings."
  }
];

    const defaultState = {
      activeRoute: "dashboard",
      selectedAssessmentId: null,
      assessments: [],
      controls: [],
      recommendations: [],
      reports: [],
      checklist: [],
      promptHelper: {
        input: "",
        output: ""
      },
      build: {
        part1: true,
        part2: false,
        part3: false,
        part4: false,
        part5: false,
        part6: false,
        part7: false
      },
      createdAt: nowIso(),
      updatedAt: nowIso()
    };

    let state = loadState();

    function nowIso() {
      return new Date().toISOString();
    }

    function uid(prefix = "id") {
      if (window.crypto && crypto.randomUUID) {
        return `${prefix}_${crypto.randomUUID()}`;
      }

      return `${prefix}_${Date.now()}_${Math.random().toString(16).slice(2)}`;
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(APP_KEY);
        if (!saved) return clone(defaultState);

        return {
          ...clone(defaultState),
          ...JSON.parse(saved)
        };
      } catch (error) {
        console.warn("State load failed. Starting from default state.", error);
        return clone(defaultState);
      }
    }

    function saveState() {
      state.updatedAt = nowIso();
      localStorage.setItem(APP_KEY, JSON.stringify(state));
    }

    function setState(patch, shouldRender = true) {
      state = {
        ...state,
        ...patch,
        updatedAt: nowIso()
      };

      saveState();

      if (shouldRender) render();
    }

    function updateBuildFlag(partKey) {
      state.build = {
        ...state.build,
        [partKey]: true
      };

      saveState();
    }

    function formatDate(value) {
      if (!value) return "Not available";

      try {
        return new Intl.DateTimeFormat("en-GB", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date(value));
      } catch {
        return "Invalid date";
      }
    }

    function getActiveRoute() {
      return routes.find(route => route.id === state.activeRoute) || routes[0];
    }

    function navigate(routeId) {
      if (!routes.some(route => route.id === routeId)) return;

      state.activeRoute = routeId;
      saveState();
      closeMobileMenu();
      render();
    }
function getActiveAssessmentTab() {
  return state.activeAssessmentTab || "overview";
}

function setAssessmentTab(tabId) {
  state.activeAssessmentTab = tabId;
  state.activeRoute = "assessments";
  saveState();
  render();
}

function openAssessmentWorkspace(id, tabId = "overview") {
  state.selectedAssessmentId = id;
  state.activeAssessmentTab = tabId;
  state.activeRoute = "assessments";
  saveState();
  render();
}
    function getSelectedAssessment() {
      if (!state.selectedAssessmentId) return null;
      return state.assessments.find(assessment => assessment.id === state.selectedAssessmentId) || null;
    }

    function toggleMobileMenu() {
      document.getElementById("sidebar").classList.toggle("open");
    }

    function closeMobileMenu() {
      document.getElementById("sidebar").classList.remove("open");
    }

    function resetData() {
      const confirmed = confirm("Reset all locally saved workbench data?");
      if (!confirmed) return;

      localStorage.removeItem(APP_KEY);
      state = clone(defaultState);
      render();

let wizardSectionIndex = 0;

function getWizardSection() {
  return assessmentSections[wizardSectionIndex] || assessmentSections[0] || null;
}

function setWizardSection(index) {
  wizardSectionIndex = Math.max(0, Math.min(index, assessmentSections.length - 1));
  state.activeAssessmentTab = "wizard";
  state.activeRoute = "assessments";
  saveState();
  render();
}

function getQuestionsForSection(sectionId) {
  return assessmentQuestions.filter(question => question.sectionId === sectionId);
}

function getAnsweredCount(assessment) {
  return assessmentQuestions.filter(question => {
    const value = assessment.answers?.[question.id];
    return value !== undefined && value !== null && value !== "";
  }).length;
}

function getSectionProgress(assessment, sectionId) {
  const questions = getQuestionsForSection(sectionId);
  if (!questions.length) return 0;

  const answered = questions.filter(question => {
    const value = assessment.answers?.[question.id];
    return value !== undefined && value !== null && value !== "";
  }).length;

  return Math.round((answered / questions.length) * 100);
}

function renderWizard() {
  const assessment = getSelectedAssessment();

  if (!assessment) {
    return `
      <div class="card">
        ${emptyState("No assessment selected", "Create or select an assessment before opening the wizard.")}
      </div>
    `;
  }

  if (!assessmentQuestions.length) {
    return `
      <div class="card">
        <h2>Assessment Wizard</h2>
        <p class="notice">
          The wizard shell is ready, but the question bank has not been installed yet.
        </p>
      </div>
    `;
  }

  const section = getWizardSection();
  const questions = getQuestionsForSection(section.id);
  const answeredCount = getAnsweredCount(assessment);
  const totalQuestions = assessmentQuestions.length;
  const progress = totalQuestions ? Math.round((answeredCount / totalQuestions) * 100) : 0;
  const currentSectionProgress = getSectionProgress(assessment, section.id);

  return `
    <div class="card hero-card">
      <div class="workspace-title-row">
        <div>
          <div class="eyebrow">Guided assessment wizard</div>
          <h2 class="workspace-title">${escapeHtml(section.title)}</h2>
          <p class="subtitle">${escapeHtml(section.description)}</p>
        </div>

        <div>
          <span class="pill ${progress === 100 ? "green" : ""}">${progress}% complete</span>
          <div class="save-status">✓ Saved locally</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="progress-bar">
        <div class="progress-fill" style="width:${progress}%"></div>
      </div>

      <p class="item-meta" style="margin-top:10px;">
        ${answeredCount} of ${totalQuestions} questions answered · Current section ${currentSectionProgress}% complete
      </p>
    </div>

    <div class="grid two">
      <div class="card assessment-rail">
        <h2>Assessment sections</h2>
        <p class="subtitle">Work through each section. Your answers save automatically.</p>

        <div class="divider"></div>

        ${renderWizardStepper(assessment)}

        <div class="divider"></div>

        <div class="notice">
          ${renderWizardGuidance(section.id)}
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="workspace-title-row">
            <div>
              <h2>${escapeHtml(section.title)}</h2>
              <p class="subtitle">${escapeHtml(section.description)}</p>
            </div>
            <span class="pill">${currentSectionProgress}% section complete</span>
          </div>

          <div class="divider"></div>

          <div class="form-grid">
            ${questions.map(question => renderQuestionInput(assessment, question)).join("")}
          </div>
        </div>

        ${renderWizardFooter(assessment)}
      </div>
    </div>
  `;
}

function renderQuestionInput(assessment, question) {
  const value = assessment.answers?.[question.id] ?? "";
  const answered = value !== undefined && value !== null && value !== "";

  const status = answered
    ? `<div class="question-status">✓ Answer saved</div>`
    : `<div class="item-meta">Not answered yet</div>`;

  if (question.type === "textarea") {
    return `
      <div class="wizard-question ${answered ? "answered" : ""}">
        <div class="workspace-title-row">
          <div>
            <label class="item-title">${escapeHtml(question.label)}</label>
            <div class="item-meta">${escapeHtml(question.helper || "")}</div>
          </div>
          ${status}
        </div>

        <div style="height:10px;"></div>

        <textarea 
          class="textarea" 
          data-answer-question="${question.id}" 
          data-assessment-id="${assessment.id}"
          placeholder="Add context here..."
        >${escapeHtml(value)}</textarea>
      </div>
    `;
  }

  if (question.type === "select") {
    return `
      <div class="wizard-question ${answered ? "answered" : ""}">
        <div class="workspace-title-row">
          <div>
            <label class="item-title">${escapeHtml(question.label)}</label>
            <div class="item-meta">${escapeHtml(question.helper || "")}</div>
          </div>
          ${status}
        </div>

        <div style="height:10px;"></div>

        <select 
          class="select" 
          data-answer-question="${question.id}" 
          data-assessment-id="${assessment.id}"
        >
          ${(question.options || []).map(option => `
            <option value="${escapeAttr(option.value)}" ${String(value) === String(option.value) ? "selected" : ""}>
              ${escapeHtml(option.label)}
            </option>
          `).join("")}
        </select>
      </div>
    `;
  }

  return `
    <div class="wizard-question ${answered ? "answered" : ""}">
      <div class="workspace-title-row">
        <div>
          <label class="item-title">${escapeHtml(question.label)}</label>
          <div class="item-meta">${escapeHtml(question.helper || "")}</div>
        </div>
        ${status}
      </div>

      <div style="height:10px;"></div>

      <input 
        class="input" 
        value="${escapeAttr(value)}" 
        data-answer-question="${question.id}" 
        data-assessment-id="${assessment.id}"
      />
    </div>
  `;
}

function renderWizardStepper(assessment) {
  return `
    <div class="wizard-stepper">
      ${assessmentSections.map((section, index) => {
        const progress = getSectionProgress(assessment, section.id);
        const isActive = index === wizardSectionIndex;
        const isComplete = progress === 100;

        return `
          <button 
            class="wizard-step ${isActive ? "active" : ""}" 
            data-action="wizard-section" 
            data-index="${index}"
          >
            <div class="workspace-title-row">
              <div>
                <div class="item-title">${escapeHtml(section.title)}</div>
                <div class="item-meta">${progress}% complete</div>
              </div>
              <span class="pill ${isComplete ? "green" : ""}">
                ${isComplete ? "Done" : isActive ? "Now" : "Open"}
              </span>
            </div>

            <div class="progress-bar">
              <div class="progress-fill" style="width:${progress}%"></div>
            </div>
          </button>
        `;
      }).join("")}
    </div>
  `;
}

function renderWizardGuidance(sectionId) {
  const guidance = {
    context: "Start by clarifying what the AI use case is for, who uses it, and whether it influences decisions.",
    data: "Focus on personal data, sensitive data, data reuse, and whether the data is reliable enough for this purpose.",
    impact: "Consider who could be affected, whether customers are involved, and whether financial or vulnerable-customer impacts exist.",
    model: "Think about reliability, hallucination, explainability, output testing, and whether human oversight is meaningful.",
    governance: "Confirm ownership, documentation, monitoring, approval, and whether the use case is ready to move forward."
  };

  return guidance[sectionId] || "Answer the questions in this section as clearly as possible.";
}

function renderWizardFooter(assessment) {
  const progress = assessment.progress || 0;
  const isFirst = wizardSectionIndex === 0;
  const isLast = wizardSectionIndex === assessmentSections.length - 1;
  const nextSection = assessmentSections[wizardSectionIndex + 1];

  return `
    <div class="wizard-footer">
      <div class="workspace-title-row">
        <div>
          <div class="save-status">✓ Autosaved</div>
          <div class="item-meta">
            ${
              isLast
                ? "Final section. Review the results when you are ready."
                : `Next: ${escapeHtml(nextSection?.title || "Results")}`
            }
          </div>
        </div>

        <div class="toolbar">
          <button class="button" data-action="wizard-prev" ${isFirst ? "disabled" : ""}>Previous</button>
          ${
            isLast
              ? `<button class="button primary" data-action="set-assessment-tab" data-tab="results">Review results</button>`
              : `<button class="button primary" data-action="wizard-next">Next section</button>`
          }
          ${
            progress === 100
              ? `<button class="button coral" data-action="complete-assessment">Mark complete</button>`
              : ""
          }
        </div>
      </div>
    </div>
  `;
}

function completeAssessmentDraft() {
  const assessment = getSelectedAssessment();
  if (!assessment) return;

  state.assessments = state.assessments.map(item => {
    if (item.id !== assessment.id) return item;

    return {
      ...recalculateAssessment(item),
      status: "Complete",
      updatedAt: nowIso()
    };
  });

  saveState();
  state.activeRoute = "assessments";
state.activeAssessmentTab = "results";
  render();
}

    function selectAssessment(id) {
      state.selectedAssessmentId = id;
      saveState();
      render();
    }

    function deleteAssessment(id) {
      const confirmed = confirm("Delete this assessment?");
      if (!confirmed) return;

      state.assessments = state.assessments.filter(assessment => assessment.id !== id);

      if (state.selectedAssessmentId === id) {
        state.selectedAssessmentId = state.assessments[0]?.id || null;
      }

      saveState();
      render();
    }

    function updateAssessmentField(id, field, value) {
      state.assessments = state.assessments.map(assessment => {
        if (assessment.id !== id) return assessment;

        return {
          ...assessment,
          [field]: value,
          updatedAt: nowIso()
        };
      });

      saveState();
    }

    function updateAssessmentAnswer(id, questionId, value) {
      state.assessments = state.assessments.map(assessment => {
        if (assessment.id !== id) return assessment;

        const next = {
          ...assessment,
          answers: {
            ...assessment.answers,
            [questionId]: value
          },
          updatedAt: nowIso()
        };

        return recalculateAssessment(next);
      });

      saveState();
      render();
    }

    max: 54,
    className: "amber",
    summary: "The use case has material risk indicators and should have defined controls, ownership, and review evidence."
  },
  {
    id: "high",
    label: "High risk",
    min: 55,
    max: 100,
    className: "red",
    summary: "The use case has significant risk indicators and should receive enhanced governance, assurance, and approval."
  }
];

function getQuestionScore(question, answerValue) {
  if (!question || answerValue === undefined || answerValue === null || answerValue === "") {
    return 0;
  }

  if (question.type === "select") {
    const option = (question.options || []).find(item => String(item.value) === String(answerValue));
    return Number(option?.score || 0);
  }

  if (question.scoring) {
    const text = String(answerValue).trim().toLowerCase();

    if (!text) return 0;
    if (text.length < 30) return Number(question.scoring.unclear || 2);
    if (text.length < 140) return Number(question.scoring.narrow || 1);

    return Number(question.scoring.broad || 2);
  }

  return 0;
}

function getMaxQuestionScore(question) {
  if (!question) return 0;

  if (question.type === "select") {
    return Math.max(...(question.options || []).map(option => Number(option.score || 0)), 0);
  }

  if (question.scoring) {
    return Math.max(...Object.values(question.scoring).map(Number), 0);
  }

  return 0;
}

function calculateAssessmentScore(assessment) {
  if (!assessmentQuestions.length) {
    return {
      rawScore: 0,
      maxScore: 0,
      weightedScore: 0,
      riskLevel: "Not scored",
      riskBand: null,
      sectionScores: [],
      drivers: []
    };
  }

  let rawScore = 0;
  let maxScore = 0;
  const drivers = [];

  const sectionScores = assessmentSections.map(section => {
    const questions = getQuestionsForSection(section.id);
    let sectionRaw = 0;
    let sectionMax = 0;
    let answered = 0;

    questions.forEach(question => {
      const answerValue = assessment.answers?.[question.id];
      const questionScore = getQuestionScore(question, answerValue);
      const questionMax = getMaxQuestionScore(question);

      sectionRaw += questionScore;
      sectionMax += questionMax;

      if (answerValue !== undefined && answerValue !== null && answerValue !== "") {
        answered += 1;
      }

      if (questionScore >= 4) {
        drivers.push({
          id: question.id,
          sectionId: section.id,
          sectionTitle: section.title,
          label: question.label,
          score: questionScore,
          answer: getAnswerLabel(question, answerValue),
          severity: questionScore >= 5 ? "High" : "Medium"
        });
      }
    });

    rawScore += sectionRaw;
    maxScore += sectionMax;

    return {
      sectionId: section.id,
      title: section.title,
      rawScore: sectionRaw,
      maxScore: sectionMax,
      percentage: sectionMax ? Math.round((sectionRaw / sectionMax) * 100) : 0,
      answered,
      total: questions.length
    };
  });

  const weightedScore = maxScore ? Math.round((rawScore / maxScore) * 100) : 0;
  const riskBand = riskBands.find(band => weightedScore >= band.min && weightedScore <= band.max) || riskBands[0];

  return {
    rawScore,
    maxScore,
    weightedScore,
    riskLevel: riskBand.label,
    riskBand,
    sectionScores,
    drivers: drivers.sort((a, b) => b.score - a.score)
  };
}

function getAnswerLabel(question, answerValue) {
  if (!question) return "Unknown";

  if (question.type === "select") {
    const option = (question.options || []).find(item => String(item.value) === String(answerValue));
    return option?.label || "Not answered";
  }

  if (!answerValue) return "Not answered";

  return String(answerValue).length > 90
    ? `${String(answerValue).slice(0, 90)}...`
    : String(answerValue);
}

function getAssessmentStatus(assessment, progress, weightedScore) {
  if (progress < 100) return "Draft";
  if (weightedScore >= 55) return "Enhanced review required";
  if (weightedScore >= 25) return "Review required";
  return "Complete";
}

function getGovernanceDecision(assessment) {
  const score = assessment.score || 0;
  const progress = assessment.progress || 0;

  if (progress < 100) {

      approval: "Not ready for deployment decision",
      monitoring: "Not yet defined",
      summary: "This assessment is still incomplete. Complete all wizard sections before relying on the risk outcome."

  if (score >= 55) {
    return {

      reviewRoute: "Responsible AI, Data Governance, Privacy, Security, and senior business owner review",
      approval: "Do not deploy without explicit approval and evidence review",
      monitoring: "Formal monitoring plan required before go-live",
      summary: "This use case has significant risk indicators and should not proceed without enhanced governance review."
    };
  }

  if (score >= 25) {

function enhancedMetricCard(label, value, helper, progressValue = null) {
  return `
    <div class="card metric-card">
      <div>
        <div class="metric-label">${escapeHtml(label)}</div>
        <div class="metric-value">${escapeHtml(value)}</div>
      </div>
      ${progressValue !== null ? `
        <div class="progress-bar">
          <div class="progress-fill" style="width:${Math.max(0, Math.min(100, Number(progressValue)))}%"></div>
        </div>
      ` : ""}
      <div class="metric-helper">${escapeHtml(helper)}</div>
    </div>
  `;
}

    document.addEventListener("click", event => {
      const routeTarget = event.target.closest("[data-route]");
      const actionTarget = event.target.closest("[data-action]");

      if (routeTarget) {
        navigate(routeTarget.dataset.route);
        return;
      }

      if (!actionTarget) return;

      const action = actionTarget.dataset.action;
      const id = actionTarget.dataset.id;

      const actions = {
  "toggle-menu": toggleMobileMenu,
  "seed-demo": seedDemoData,
  "seed-rich-demo": seedRichDemoData,
  "reset-data": resetData,
  "create-assessment": createAssessmentShell,
  "select-assessment": () => selectAssessment(id),
  "open-assessment": () => openAssessmentWorkspace(id, "overview"),
  "open-assessment-wizard": () => openAssessmentWorkspace(id, "wizard"),
  "delete-assessment": () => deleteAssessment(id),
  "export-json": exportStateAsJson,
  "copy-summary": copySummaryToClipboard,
  "wizard-prev": () => setWizardSection(wizardSectionIndex - 1),
  "wizard-next": () => setWizardSection(wizardSectionIndex + 1),
  "wizard-section": () => setWizardSection(Number(actionTarget.dataset.index)),
  "complete-assessment": completeAssessmentDraft,
  "copy-markdown": copyMarkdownReport,
  "download-markdown": downloadMarkdownReport,
  "print-view": printCurrentView,
  "set-assessment-tab": () => setAssessmentTab(actionTarget.dataset.tab)
};
      if (actions[action]) actions[action]();
    });

    document.addEventListener("input", event => {
      
const promptHelperInput = event.target.closest("[data-prompt-helper-input]");
if (promptHelperInput) {
  updatePromptHelper(promptHelperInput.value);
  return;
}
const input = event.target.closest("[data-input-field]");
      if (!input) return;

		const answerInput = event.target.closest("[data-answer-question]");
if (answerInput) {
  updateAssessmentAnswer(
    answerInput.dataset.assessmentId,
    answerInput.dataset.answerQuestion,
    answerInput.value
  );
  return;
}
      updateAssessmentField(
        input.dataset.assessmentId,
        input.dataset.inputField,
        input.value
      );
    });

    render();
  </script>
