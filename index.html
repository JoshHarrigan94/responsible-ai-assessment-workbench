<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Responsible AI Assessment Workbench</title>

  <style>
    /* =====================================================
       PART 1 — DESIGN SYSTEM
    ===================================================== */

    :root {
      --navy-950: #061326;
      --navy-900: #0b1f3b;
      --navy-800: #12325b;
      --navy-700: #1c4a7a;

      --coral-600: #ff4d57;
      --coral-500: #ff6b5f;
      --coral-100: #ffe7e4;

      --bg-main: #f6f4f2;
      --bg-card: #ffffff;
      --bg-soft: #f1f5f9;

      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-300: #cbd5e1;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;

      --green-600: #15803d;
      --green-100: #dcfce7;
      --amber-600: #b45309;
      --amber-100: #fef3c7;
      --red-600: #b91c1c;
      --red-100: #fee2e2;

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;

      --shadow-soft: 0 16px 40px rgba(15, 23, 42, 0.08);
      --shadow-card: 0 10px 30px rgba(15, 23, 42, 0.07);

      --sidebar-width: 290px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 107, 95, 0.16), transparent 32rem),
        linear-gradient(135deg, #f8fafc, var(--bg-main));
      color: var(--slate-900);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(18px);
      border-right: 1px solid var(--slate-200);
      overflow-y: auto;
      z-index: 10;
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--navy-900), var(--coral-500));
      color: white;
      font-weight: 900;
      letter-spacing: -0.04em;
      box-shadow: var(--shadow-card);
    }

    .brand-title {
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .brand-subtitle {
      margin-top: 4px;
      color: var(--slate-500);
      font-size: 0.82rem;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--slate-600);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      transition: 0.18s ease;
    }

    .nav-button:hover {
      background: var(--slate-100);
      color: var(--navy-900);
    }

    .nav-button.active {
      background: var(--navy-900);
      color: white;
      font-weight: 800;
    }

    .sidebar-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--slate-200);
    }

    .sidebar-label {
      margin-bottom: 10px;
      color: var(--slate-500);
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .main {
      min-width: 0;
      padding: 28px;
    }

    .topbar {
      margin-bottom: 24px;
      padding: 22px;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow-soft);
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
    }

    .mobile-menu {
      display: none;
      margin-bottom: 12px;
    }

    .eyebrow {
      color: var(--coral-600);
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(1.75rem, 3vw, 2.65rem);
      letter-spacing: -0.06em;
      line-height: 1;
    }

    h2 {
      font-size: 1.22rem;
      letter-spacing: -0.03em;
    }

    h3 {
      font-size: 1rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      max-width: 780px;
      color: var(--slate-600);
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .button {
      border: 1px solid var(--slate-200);
      background: white;
      color: var(--slate-900);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.05);
      transition: 0.18s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1);
    }

    .button.primary {
      background: var(--navy-900);
      color: white;
      border-color: var(--navy-900);
    }

    .button.coral {
      background: var(--coral-500);
      color: white;
      border-color: var(--coral-500);
    }

    .button.ghost {
      background: transparent;
      box-shadow: none;
    }

    .button.danger {
      color: var(--red-600);
    }

    .button.small {
      padding: 7px 11px;
      font-size: 0.86rem;
    }

    .view {
      display: grid;
      gap: 20px;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-card);
    }

    .card.soft {
      background: rgba(248, 250, 252, 0.82);
    }

    .metric-card {
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-label {
      color: var(--slate-500);
      font-weight: 800;
      font-size: 0.9rem;
    }

    .metric-value {
      margin-top: 10px;
      font-size: 2.3rem;
      font-weight: 950;
      letter-spacing: -0.07em;
    }

    .metric-helper {
      margin-top: 12px;
      color: var(--slate-500);
      font-size: 0.9rem;
    }

    .pill {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--slate-100);
      color: var(--slate-600);
      font-size: 0.78rem;
      font-weight: 900;
    }

    .pill.green {
      background: var(--green-100);
      color: var(--green-600);
    }

    .pill.amber {
      background: var(--amber-100);
      color: var(--amber-600);
    }

    .pill.red {
      background: var(--red-100);
      color: var(--red-600);
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .list-item {
      border: 1px solid var(--slate-200);
      background: white;
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .item-title {
      font-weight: 900;
      margin-bottom: 4px;
    }

    .item-meta {
      color: var(--slate-500);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .empty {
      padding: 38px 24px;
      border: 1px dashed var(--slate-300);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.6);
      text-align: center;
      color: var(--slate-500);
    }

    .empty strong {
      display: block;
      color: var(--slate-900);
      margin-bottom: 8px;
      font-size: 1.05rem;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      font-weight: 900;
      font-size: 0.9rem;
    }

    .field small {
      color: var(--slate-500);
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid var(--slate-200);
      border-radius: 14px;
      background: white;
      padding: 11px 13px;
      color: var(--slate-900);
      outline: none;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--navy-700);
      box-shadow: 0 0 0 4px rgba(28, 74, 122, 0.12);
    }

    .divider {
      height: 1px;
      background: var(--slate-200);
      margin: 18px 0;
    }

    .notice {
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--coral-100);
      color: var(--slate-900);
      border: 1px solid rgba(255, 107, 95, 0.22);
      line-height: 1.5;
    }

    .code-anchor {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.82rem;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--slate-100);
      color: var(--slate-700);
    }

    @media (max-width: 940px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
        position: fixed;
        inset: 0 auto 0 0;
        width: min(86vw, 330px);
      }

      .sidebar.open {
        display: block;
      }

      .main {
        padding: 16px;
      }

      .topbar {
        flex-direction: column;
      }

      .toolbar {
        justify-content: flex-start;
      }

      .mobile-menu {
        display: inline-flex;
      }

      .grid.two,
      .grid.three {
        grid-template-columns: 1fr;
      }
    }

    /* =====================================================
       PASTE PART 7 CSS POLISH HERE
    ===================================================== */
.workspace-header {
  display: grid;
  gap: 14px;
}

.workspace-title-row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
  flex-wrap: wrap;
}

.workspace-title {
  margin: 0;
  font-size: 1.45rem;
  letter-spacing: -0.04em;
}

.workspace-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 6px;
  border: 1px solid var(--slate-200);
  background: var(--slate-100);
  border-radius: 999px;
  width: fit-content;
}

.workspace-tab {
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--slate-600);
  padding: 9px 13px;
  font-weight: 900;
}

.workspace-tab.active {
  background: white;
  color: var(--navy-900);
  box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
}

.assessment-rail {
  position: sticky;
  top: 24px;
}

.save-status {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  color: var(--green-600);
  font-size: 0.86rem;
  font-weight: 900;
}

.hero-card {
  background:
    radial-gradient(circle at top right, rgba(255, 107, 95, 0.18), transparent 20rem),
    linear-gradient(135deg, white, #f8fafc);
}

.workflow-steps {
  display: grid;
  gap: 12px;
}

.workflow-step {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 12px;
  align-items: start;
}

.step-number {
  width: 34px;
  height: 34px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  background: var(--navy-900);
  color: white;
  font-weight: 900;
}

.hero-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.assessment-card {
  transition: 0.18s ease;
}

.assessment-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-soft);
}

.empty-action {
  margin-top: 16px;
}

.wizard-stepper {
  display: grid;
  gap: 10px;
}

.wizard-step {
  border: 1px solid var(--slate-200);
  background: white;
  border-radius: var(--radius-md);
  padding: 14px;
  text-align: left;
  display: grid;
  gap: 6px;
  transition: 0.18s ease;
}

.wizard-step:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-card);
}

.wizard-step.active {
  border-color: var(--navy-900);
  background: var(--navy-900);
  color: white;
}

.wizard-step.active .item-meta {
  color: rgba(255, 255, 255, 0.78);
}

.wizard-question {
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  padding: 18px;
  background: white;
}

.wizard-question.answered {
  border-color: rgba(21, 128, 61, 0.35);
  background: linear-gradient(135deg, white, #f8fff9);
}

.wizard-footer {
  position: sticky;
  bottom: 16px;
  z-index: 5;
  border: 1px solid var(--slate-200);
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(16px);
  border-radius: var(--radius-lg);
  padding: 14px;
  box-shadow: var(--shadow-soft);
}

.wizard-journey-intro {
  display: grid;
  gap: 16px;
}

.review-summary-grid {
  display: grid;
  gap: 14px;
}

.review-section-card {
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  background: white;
  padding: 18px;
}

.review-answer {
  display: grid;
  gap: 6px;
  padding: 12px 0;
  border-top: 1px solid var(--slate-200);
}

.review-answer:first-of-type {
  border-top: 0;
}

.missing-answer {
  color: var(--red-600);
  font-weight: 900;
}

.review-status-strip {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.journey-map {
  display: grid;
  gap: 10px;
}

.journey-map-item {
  border: 1px solid var(--slate-200);
  background: white;
  border-radius: var(--radius-md);
  padding: 14px;
  display: grid;
  grid-template-columns: 34px 1fr auto;
  gap: 12px;
  align-items: center;
}

.journey-map-number {
  width: 34px;
  height: 34px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  background: var(--slate-100);
  color: var(--navy-900);
  font-weight: 900;
}

.journey-map-item.active {
  border-color: var(--navy-900);
  background: linear-gradient(135deg, white, #f8fafc);
}

.journey-map-item.complete .journey-map-number {
  background: var(--green-100);
  color: var(--green-600);
}

.question-status {
  font-size: 0.8rem;
  font-weight: 900;
  color: var(--green-600);
}

.risk-hero {
  display: grid;
  gap: 16px;
  border-radius: var(--radius-lg);
  padding: 24px;
  background: linear-gradient(135deg, white, #f8fafc);
  border: 1px solid var(--slate-200);
}

.risk-score-large {
  font-size: clamp(3rem, 8vw, 5rem);
  font-weight: 950;
  letter-spacing: -0.08em;
  line-height: 0.9;
}

.priority-card {
  border-left: 6px solid var(--navy-900);
}

.priority-card.high {
  border-left-color: var(--red-600);
}

.priority-card.medium {
  border-left-color: var(--amber-600);
}

.priority-card.low {
  border-left-color: var(--green-600);
}

.executive-summary {
  white-space: pre-wrap;
  line-height: 1.65;
}

.prototype-banner {
  border: 1px solid rgba(255, 107, 95, 0.35);
  background: linear-gradient(135deg, #fff7f5, white);
  border-radius: var(--radius-lg);
  padding: 16px;
  display: grid;
  gap: 6px;
}

.trust-strip {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.trust-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 999px;
  background: white;
  border: 1px solid var(--slate-200);
  padding: 7px 11px;
  font-size: 0.82rem;
  font-weight: 900;
  color: var(--slate-600);
}

.alignment-grid {
  display: grid;
  gap: 14px;
}

.alignment-card {
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  background: white;
  padding: 18px;
  display: grid;
  gap: 10px;
}

.alignment-card.strong {
  border-left: 6px solid var(--green-600);
}

.alignment-card.partial {
  border-left: 6px solid var(--amber-600);
}

.alignment-card.weak {
  border-left: 6px solid var(--red-600);
}

.alignment-score {
  font-size: 1.8rem;
  font-weight: 950;
  letter-spacing: -0.05em;
}

.methodology-box {
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  padding: 18px;
  background: linear-gradient(135deg, white, #f8fafc);
  display: grid;
  gap: 10px;
}

.demo-note {
  font-size: 0.9rem;
  color: var(--slate-600);
  line-height: 1.55;
}

.floating-menu-button {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 1200;
  width: 54px;
  height: 54px;
  border-radius: 16px;
  border: 1px solid rgba(15, 23, 42, 0.08);
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(18px);
  box-shadow: 0 12px 32px rgba(15, 23, 42, 0.14);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: 0.18s ease;
}

.floating-menu-button:hover {
  transform: translateY(-2px);
}

.floating-menu-icon {
  display: grid;
  gap: 4px;
}

.floating-menu-icon span {
  width: 18px;
  height: 2px;
  border-radius: 999px;
  background: var(--navy-900);
}

.assessment-progress-floating {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 1100;
  min-width: 220px;
  border-radius: 18px;
  padding: 14px;
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(15,23,42,0.08);
  box-shadow: 0 12px 32px rgba(15,23,42,0.12);
  display: grid;
  gap: 10px;
}

.assessment-progress-title {
  font-size: 0.82rem;
  font-weight: 900;
  color: var(--slate-500);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.assessment-progress-name {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--navy-900);
}

.setup-card {
  max-width: 920px;
  margin: 0 auto;
}

.setup-intro {
  display: grid;
  gap: 10px;
  margin-bottom: 18px;
}

.required-dot {
  color: var(--coral-600);
  font-weight: 900;
}

.form-actions {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.demo-walkthrough {
  display: grid;
  gap: 14px;
}

.demo-step-card {
  border: 1px solid var(--slate-200);
  background: white;
  border-radius: var(--radius-lg);
  padding: 18px;
  display: grid;
  gap: 10px;
}

.demo-step-card.current {
  border-left: 6px solid var(--coral-500);
}

.demo-flow-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.qa-checklist {
  display: grid;
  gap: 14px;
}

.qa-item {
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  background: white;
  padding: 18px;
  display: grid;
  gap: 8px;
}

.qa-item.complete {
  border-left: 6px solid var(--green-600);
}

.demo-script-box {
  border: 1px solid var(--slate-200);
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, white, #f8fafc);
  padding: 18px;
  display: grid;
  gap: 12px;
}

.demo-script-step {
  padding: 10px 0;
  border-top: 1px solid var(--slate-200);
}

.demo-script-step:first-child {
  border-top: 0;
}

.progress-bar {
  width: 100%;
  height: 10px;
  border-radius: 999px;
  background: var(--slate-100);
  overflow: hidden;
  border: 1px solid var(--slate-200);
}

.progress-fill {

      return `${prefix}_${Date.now()}_${Math.random().toString(16).slice(2)}`;

      return JSON.parse(JSON.stringify(value));

    function loadState() {
      try {
        const saved = localStorage.getItem(APP_KEY);
        if (!saved) return clone(defaultState);

        return {
          ...clone(defaultState),
          ...JSON.parse(saved)
        };
      } catch (error) {
        console.warn("State load failed. Starting from default state.", error);
        return clone(defaultState);
      }
    }

    function saveState() {
      state.updatedAt = nowIso();
      localStorage.setItem(APP_KEY, JSON.stringify(state));
    }

      state = {
        ...state,

          day: "2-digit",

          hour: "2-digit",

function getVisibleAssessmentSections(assessment) {
  if (!adaptiveAssessmentSettings.enabled) return assessmentSections;

  const routing = calculateGovernanceRouting(assessment || {});
  const routeId = routing.routeId || "lightweight";

  return assessmentSections.filter(section => {
    if (adaptiveAssessmentSettings.alwaysShowSections.includes(section.id)) return true;
    if (!section.routeRelevance || !section.routeRelevance.length) return true;

    return section.routeRelevance.includes(routeId);
  });
}

function isQuestionVisible(question, assessment) {
  if (!adaptiveAssessmentSettings.enabled) return true;
  if (adaptiveAssessmentSettings.alwaysShowQuestionIds.includes(question.id)) return true;

  const routing = calculateGovernanceRouting(assessment || {});
  const routeId = routing.routeId || "lightweight";

  if (!question.requiredForRoutes || !question.requiredForRoutes.length) return true;

  return question.requiredForRoutes.includes(routeId);
}

function getVisibleQuestionsForSection(assessment, sectionId) {
  return assessmentQuestions.filter(question => {
    return question.sectionId === sectionId && isQuestionVisible(question, assessment);
  });
}

function getVisibleAssessmentQuestions(assessment) {
  return assessmentQuestions.filter(question => isQuestionVisible(question, assessment));
}

function clampWizardSectionIndex(assessment) {
  const visibleSections = getVisibleAssessmentSections(assessment);

  if (!visibleSections.length) {
    wizardSectionIndex = 0;
    return;
  }

  wizardSectionIndex = Math.max(0, Math.min(wizardSectionIndex, visibleSections.length - 1));
}

function setWizardMode(mode) {
  state.wizardMode = mode;
  state.activeRoute = "assessments";
  state.activeAssessmentTab = "wizard";
  saveState();
  render();
}

function getWizardSection() {
  const assessment = getSelectedAssessment();
  const visibleSections = getVisibleAssessmentSections(assessment);

  return visibleSections[wizardSectionIndex] || visibleSections[0] || assessmentSections[0] || null;
}

function setWizardSection(index) {
  wizardSectionIndex = Math.max(0, Math.min(index, assessmentSections.length - 1));
  state.activeAssessmentTab = "wizard";

  render();
}

function setWizardSection(index) {

const isLast = wizardSectionIndex === visibleSections.length - 1;

if (isLast) {
  state.wizardMode = "review";
  state.activeAssessmentTab = "wizard";
  state.activeRoute = "assessments";
  saveState();
  render();
  return;
}

wizardSectionIndex += 1;

state.wizardMode = "intro";
state.activeRoute = "assessments";
state.activeAssessmentTab = "wizard";

saveState();
render();
}

function getQuestionsForSection(sectionId, assessment = getSelectedAssessment()) {
  return getVisibleQuestionsForSection(assessment, sectionId);
}

function getAnsweredCount(assessment) {
  return getVisibleAssessmentQuestions(assessment).filter(question => {
    const value = assessment.answers?.[question.id];
    return value !== undefined && value !== null && value !== "";
  }).length;
}

function getSectionProgress(assessment, sectionId) {
  const questions = getQuestionsForSection(sectionId);
  if (!questions.length) return 0;

  const answered = questions.filter(question => {
    const value = assessment.answers?.[question.id];
    return value !== undefined && value !== null && value !== "";
  }).length;

  return Math.round((answered / questions.length) * 100);
}

function getMissingAnswers(assessment) {
  return getVisibleAssessmentQuestions(assessment).filter(question => {
    const value = assessment.answers?.[question.id];
    return value === undefined || value === null || value === "";
  });
}

function getQuestionScore(question, answerValue) {
  if (!question || answerValue === undefined || answerValue === null || answerValue === "") {
    return 0;
  }

  if (question.type === "select") {
    const option = (question.options || []).find(item => String(item.value) === String(answerValue));
    return Number(option?.score || 0);
  }

  if (question.scoring) {
    const text = String(answerValue).trim().toLowerCase();

    if (!text) return 0;
    if (text.length < 30) return Number(question.scoring.unclear || 2);
    if (text.length < 140) return Number(question.scoring.narrow || 1);

    return Number(question.scoring.broad || 2);
  }

  return 0;
}

function getMaxQuestionScore(question) {
  if (!question) return 0;

  if (question.type === "select") {
    return Math.max(...(question.options || []).map(option => Number(option.score || 0)), 0);
  }

  if (question.scoring) {
    return Math.max(...Object.values(question.scoring).map(Number), 0);
  }

  return 0;
}
const governanceRouteOrder = {
  lightweight: 1,
  standard: 2,
  enhanced: 3,
  critical: 4
};

function getGovernanceRouteById(routeId) {
  return governanceRoutes.find(route => route.id === routeId) || governanceRoutes[0];
}

function getSelectedQuestionOption(question, answerValue) {
  if (!question || question.type !== "select") return null;

  return (question.options || []).find(option => String(option.value) === String(answerValue)) || null;
}

function getHighestGovernanceRoute(routeIds = []) {
  if (!routeIds.length) return "lightweight";

  return routeIds.reduce((highest, current) => {
    const highestLevel = governanceRouteOrder[highest] || 1;
    const currentLevel = governanceRouteOrder[current] || 1;

    return currentLevel > highestLevel ? current : highest;
  }, "lightweight");
}

function uniqueValues(values) {
  return [...new Set(values.filter(Boolean))];
}

function getControlById(controlId) {
  return controlLibrary[controlId] || null;
}

function calculateControlRecommendations(routing) {
  const routeId = routing.routeId || "lightweight";
  const triggerIds = (routing.triggers || []).map(trigger => trigger.id);

  const baselineControlIds = routeBaselineControls[routeId] || [];
  const triggeredControlIds = triggerIds.flatMap(triggerId => triggerControlMap[triggerId] || []);

  const allControlIds = uniqueValues([
    ...baselineControlIds,
    ...triggeredControlIds
  ]);

  const controls = allControlIds
    .map(controlId => {
      const control = getControlById(controlId);
      if (!control) return null;

      const triggeredBy = (routing.triggers || [])
        .filter(trigger => (triggerControlMap[trigger.id] || []).includes(controlId))
        .map(trigger => trigger.id);

      return {
        id: controlId,
        ...control,
        triggeredBy
      };
    })
    .filter(Boolean);

  const required = controls.filter(control => control.priority === "required");
  const recommended = controls.filter(control => control.priority === "recommended");
  const optional = controls.filter(control => control.priority === "optional");

  return {
    all: controls,
    required,
    recommended,
    optional
  };
}

function calculateGovernanceRouting(assessment) {
  const answers = assessment.answers || {};

  const triggeredRoutes = [];
  const triggers = [];
  const primarySignals = [];
  const domainScores = {};
  const unansweredPrimaryQuestions = [];

  assessmentQuestions.forEach(question => {
    const answerValue = answers[question.id];
    const answered = answerValue !== undefined && answerValue !== null && answerValue !== "";

    if (question.isPrimaryTrigger && !answered) {
      unansweredPrimaryQuestions.push(question.id);
    }

    if (!answered) return;

    const selectedOption = getSelectedQuestionOption(question, answerValue);
    const questionScore = getQuestionScore(question, answerValue);
    const domainId = question.domainId || "general";

    if (!domainScores[domainId]) {
      domainScores[domainId] = {
        domainId,
        rawScore: 0,
        maxScore: 0,
        questions: 0
      };
    }

    domainScores[domainId].rawScore += questionScore;
    domainScores[domainId].maxScore += getMaxQuestionScore(question);
    domainScores[domainId].questions += 1;

    if (selectedOption?.routeImpact) {
      triggeredRoutes.push(selectedOption.routeImpact);
    }

    if (selectedOption?.triggers?.length) {
      selectedOption.triggers.forEach(triggerId => {
        triggers.push({
          id: triggerId,
          questionId: question.id,
          questionLabel: question.label,
          answer: selectedOption.label,
          domainId: question.domainId,
          sectionId: question.sectionId,
          routeImpact: selectedOption.routeImpact || "standard",
          score: Number(selectedOption.score || 0),
          isPrimaryTrigger: Boolean(question.isPrimaryTrigger)
        });
      });
    }

    if (question.isPrimaryTrigger) {
      primarySignals.push({
        questionId: question.id,
        questionLabel: question.label,
        domainId: question.domainId,
        answer: selectedOption?.label || getAnswerLabel(question, answerValue),
        routeImpact: selectedOption?.routeImpact || "standard",
        score: questionScore
      });
    }
  });

  const routeId = getHighestGovernanceRoute(triggeredRoutes);
  const route = getGovernanceRouteById(routeId);

  const domainProfile = Object.values(domainScores).map(domain => ({
    ...domain,
    percentage: domain.maxScore ? Math.round((domain.rawScore / domain.maxScore) * 100) : 0
  }));

  const criticalTriggers = triggers.filter(trigger => trigger.routeImpact === "critical");
  const enhancedTriggers = triggers.filter(trigger => trigger.routeImpact === "enhanced");

  let routingConfidence = "High";

  if (unansweredPrimaryQuestions.length >= 3) {
    routingConfidence = "Low";
  } else if (unansweredPrimaryQuestions.length > 0) {
    routingConfidence = "Medium";
  }
  const controlRecommendations = calculateControlRecommendations({
    routeId,
    route,
    triggers,
    primarySignals,
    domainProfile,
    criticalTriggers,
    enhancedTriggers
  });
  return {
    routeId,
    route,
    routeLabel: route.label,
    routeLevel: route.level,
    routeDescription: route.description,
    approvalLevel: route.approvalLevel,
    assuranceDepth: route.assuranceDepth,
    triggers,
    primarySignals,
    domainProfile,
    criticalTriggers,
    enhancedTriggers,
    unansweredPrimaryQuestions,
        routingConfidence,
    controlRecommendations
  };
}
function calculateAssessmentScore(assessment) {
  if (!assessmentQuestions.length) {
    return {
      rawScore: 0,
      maxScore: 0,
      weightedScore: 0,
      riskLevel: "Not scored",
      riskBand: null,
      sectionScores: [],
      drivers: []
    };
  }

  let rawScore = 0;
  let maxScore = 0;
  const drivers = [];

  const sectionScores = assessmentSections.map(section => {
    const questions = getQuestionsForSection(section.id);
    let sectionRaw = 0;
    let sectionMax = 0;
    let answered = 0;

    questions.forEach(question => {
      const answerValue = assessment.answers?.[question.id];
      const questionScore = getQuestionScore(question, answerValue);
      const questionMax = getMaxQuestionScore(question);

      sectionRaw += questionScore;
      sectionMax += questionMax;

      if (answerValue !== undefined && answerValue !== null && answerValue !== "") {
        answered += 1;
      }

      if (questionScore >= 4) {
        drivers.push({
          id: question.id,
          sectionId: section.id,
          sectionTitle: section.title,
          label: question.label,
          score: questionScore,
          answer: getAnswerLabel(question, answerValue),
          severity: questionScore >= 5 ? "High" : "Medium"
        });
      }
    });

    rawScore += sectionRaw;
    maxScore += sectionMax;

    return {
      sectionId: section.id,
      title: section.title,
      rawScore: sectionRaw,
      maxScore: sectionMax,
      percentage: sectionMax ? Math.round((sectionRaw / sectionMax) * 100) : 0,
      answered,
      total: questions.length
    };
  });

  const weightedScore = maxScore ? Math.round((rawScore / maxScore) * 100) : 0;
  const riskBand = riskBands.find(band => weightedScore >= band.min && weightedScore <= band.max) || riskBands[0];

  return {
    rawScore,
    maxScore,
    weightedScore,
    riskLevel: riskBand.label,
    riskBand,
    sectionScores,
    drivers: drivers.sort((a, b) => b.score - a.score)
  };
}

function getAnswerLabel(question, answerValue) {
  if (!question) return "Unknown";

  if (question.type === "select") {
    const option = (question.options || []).find(item => String(item.value) === String(answerValue));
    return option?.label || "Not answered";
  }

  if (!answerValue) return "Not answered";

  return String(answerValue).length > 90
    ? `${String(answerValue).slice(0, 90)}...`
    : String(answerValue);
}

function getAssessmentStatus(assessment, progress, weightedScore) {
  const routeId = assessment.governanceRouteId || "lightweight";

  if (progress < 100) return "Draft";

  if (routeId === "critical") return "Senior review required";
  if (routeId === "enhanced") return "Enhanced review required";

  if (weightedScore >= 55) return "Enhanced review required";
  if (weightedScore >= 25) return "Review required";

  return "Complete";
}

function getRecommendedControls(assessment) {
  if (!assessment) return [];

  const drivers = assessment.riskDrivers || [];
  const driverIds = drivers.map(driver => driver.id);

  const recommendations = recommendationRules.filter(rule => {
    return rule.trigger.some(questionId => driverIds.includes(questionId));
  });

  if (!recommendations.length && assessment.score >= 25) {
    return recommendationRules.slice(0, 3);
  }

  if (!recommendations.length) {
    return [
      {
        id: "baseline_documentation",
        title: "Maintain baseline documentation",
        controlCategory: "Governance",
        description: "Keep purpose, owner, data, limitations, review approach, and approval notes up to date."
      }
    ];
  }

  return recommendations;
}

function getGovernanceDecision(assessment) {
  const score = assessment.score || 0;
  const progress = assessment.progress || 0;

  if (progress < 100) {
    return {
      decision: "Assessment incomplete",
      reviewRoute: "Complete wizard before formal review",
      approval: "Not ready for deployment decision",
      monitoring: "Not yet defined",
      summary: "This assessment is still incomplete. Complete all wizard sections before relying on the risk outcome."
    };
  }

  if (score >= 55) {
    return {
      decision: "Enhanced review required",
      reviewRoute: "Responsible AI, Data Governance, Privacy, Security, and senior business owner review",
      approval: "Do not deploy without explicit approval and evidence review",
      monitoring: "Formal monitoring plan required before go-live",
      summary: "This use case has significant risk indicators and should not proceed without enhanced governance review."
    };
  }

  if (score >= 25) {
    return {
      decision: "Proceed only with controls",
      reviewRoute: "Responsible AI / Data Governance review with business owner sign-off",
      approval: "Can progress if recommended controls are completed and evidenced",
      monitoring: "Define recurring monitoring and review cadence",
      summary: "This use case has material risk indicators. It may proceed only if controls are implemented and review evidence is retained."
    };
  }

  return {
    decision: "Baseline governance sufficient",
    reviewRoute: "Business owner sign-off with baseline documentation",
    approval: "Can proceed subject to normal governance expectations",
    monitoring: "Review if scope, data, model, or usage changes",
    summary: "This use case appears low risk based on current answers, provided baseline documentation and oversight are maintained."
  };
}

  return `${assessment.title} has been assessed as ${assessment.riskLevel} with a score of ${assessment.score ?? 0}/100.
